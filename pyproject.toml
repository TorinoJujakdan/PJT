[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["backend/*/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"backend/manage.py" = ["E402"]
"backend/cards/card_ingestion/parsing.py" = ["F401"]
"backend/cards/selenium_ingestion.py" = ["F401"]
